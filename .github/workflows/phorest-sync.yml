name: Phorest check

# Every Monday: reads the Phorest online menu, refreshes the theme's copy
# (wordpress/yuzu-round/inc/phorest.json), re-bakes the price panels, and
# checks every booking link and price on the live site against Phorest.
# A menu change opens a pull request; anything to fix opens or updates one issue.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/phorest_sync.py"
      - "wordpress/yuzu-round/inc/phorest*.json"
      - ".github/workflows/phorest-sync.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: phorest-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.64.1
          python -m playwright install --with-deps chromium

      - name: Read Phorest and check the site
        id: sync
        run: |
          set +e
          python scripts/phorest_sync.py --site https://yuzu.hair --report report.md
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$code" = "2" ]; then
            echo "::error::Phorest could not be read. The booking links keep using the last saved menu."
            exit 1
          fi

      - name: Re-bake the price panels
        run: |
          php scripts/sync-prices.php
          python scripts/build.py

      - name: Menu changes become a pull request
        if: github.event_name != 'pull_request'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "opened=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="phorest-menu-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A wordpress/yuzu-round/inc/phorest.json site
          git commit -m "Refresh the Phorest menu used by the booking links"
          git push -f origin "$branch"
          if gh pr create --base main --head "$branch" --title "Phorest menu changed: refresh the booking links" --body-file report.md; then
            echo "opened=pr" >> "$GITHUB_OUTPUT"
          else
            echo "opened=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Problems or an unopened PR become an issue
        if: github.event_name != 'pull_request' && (steps.sync.outputs.code == '1' || steps.pr.outputs.opened == 'failed')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Phorest booking check needs attention"
          if [ "${{ steps.pr.outputs.opened }}" = "failed" ]; then
            printf '\nThe Phorest menu changed. A branch with the refresh was pushed but no pull request could be opened; open one from the branch list.\n' >> report.md
          fi
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi
