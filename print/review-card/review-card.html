  <title>YUZU hair · Google review card (QR + NFC) · 5 × 7 in</title>
  <!--
    Counter card, 5 × 7 in (127 × 178 mm) trim, 3 mm bleed on every side (page 133 × 184 mm).
    Page 1 is the front, page 2 the back. Keep text 5 mm inside the trim.
    Stick the NFC tag on the back inside the dashed circle; it sits behind the Tap panel on the front.
    Rebuild the PDF with: node print/review-card/build.mjs
  -->
  <style>
    @font-face { font-family: "Cormorant Garamond"; font-weight: 500; src: url("../../site/fonts/cormorant-500.woff2") format("woff2"); }
    @font-face { font-family: "Cormorant Garamond"; font-weight: 600; src: url("../../site/fonts/cormorant-600.woff2") format("woff2"); }
    @font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 500; src: url("../../site/fonts/cormorant-italic-500.woff2") format("woff2"); }
    @font-face { font-family: "Outfit"; font-weight: 400; src: url("../../site/fonts/outfit-400.woff2") format("woff2"); }
    @font-face { font-family: "Outfit"; font-weight: 500; src: url("../../site/fonts/outfit-500.woff2") format("woff2"); }

    :root {
      --forest: #2f3a27;
      --beige: #efe4d4;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Outfit", system-ui, sans-serif;
      --trim-w: 127mm;
      --panel: 52mm;
      --gap: 9mm;
      --panel-top: 70mm;
      /* Tap ring centre on the front, from the trim edge. The back mirrors x. */
      --nfc-x: calc((var(--trim-w) + var(--gap) + var(--panel)) / 2);
      --nfc-y: calc(var(--panel-top) + var(--panel) / 2);
    }
    @page { size: 133mm 184mm; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .page {
      position: relative;
      width: 133mm;
      height: 184mm;
      overflow: hidden;
      background: var(--forest);
      color: var(--beige);
      page-break-after: always;
      break-after: page;
    }
    .page:last-child { page-break-after: auto; break-after: auto; }
    /* Trim area: everything is placed in trim coordinates. */
    .trim { position: absolute; left: 3mm; top: 3mm; width: 127mm; height: 178mm; }
    .trim > * { position: absolute; margin: 0; }
    .center { left: 0; right: 0; text-align: center; }

    /* ---------- front ---------- */
    .logo { left: 50%; top: 11mm; width: 68mm; transform: translateX(-50%); }
    .panel { top: var(--panel-top); width: var(--panel); height: var(--panel); }
    .panel.scan {
      left: calc(var(--nfc-x) - var(--panel) * 1.5 - var(--gap)); padding: 6mm;
      background: var(--beige); border-radius: 6mm;
    }
    .panel.scan svg { display: block; width: 100%; height: 100%; }
    .panel.tap {
      left: calc(var(--nfc-x) - var(--panel) / 2);
      border: 0.7mm solid var(--beige); border-radius: 50%;
      display: grid; place-items: center;
    }
    .panel.tap svg { width: 27mm; height: 27mm; }
    .or {
      left: calc(var(--nfc-x) - var(--panel) / 2 - var(--gap)); width: var(--gap);
      top: var(--nfc-y); transform: translateY(-50%); text-align: center;
      font: italic 500 16pt/1 var(--serif); opacity: 0.75;
    }
    .label {
      top: calc(var(--panel-top) + var(--panel) + 7mm); width: var(--panel); text-align: center;
      font: 500 12pt/1 var(--sans); letter-spacing: 0.3em; text-transform: uppercase; padding-left: 0.3em;
    }
    .label.scan { left: calc(var(--nfc-x) - var(--panel) * 1.5 - var(--gap)); }
    .label.tap { left: calc(var(--nfc-x) - var(--panel) / 2); }
    .url { top: 152mm; font: 500 17pt/1 var(--sans); letter-spacing: 0.06em; }
