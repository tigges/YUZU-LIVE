<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yuzu — Bloom</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="brand.css?v=2" />
  <link rel="stylesheet" href="bloom.css?v=1" />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="versions-bar.css?v=5" />
</head>
<body class="bloom-page">
  <nav class="version-bar" aria-label="Design versions"><a href="/">Live</a><a href="/versions/logobar.html">Logo bar</a><a href="/versions/lookbook.html">Lookbook</a><a href="/versions/atelier.html">Atelier</a><a href="/versions/split.html">Split</a><a href="/versions/pulse.html">Pulse</a><a href="/versions/bloom.html" aria-current="page">Bloom</a><a href="/versions/results.html">Results</a></nav>
  <div class="stage">
    <div class="bloom">
      <img src="img/looks/blonde-layers.jpg" alt="Soft blonde layers" />
    </div>
  </div>
  <header class="chrome">
    <a class="logo-home" href="#" aria-label="Yuzu hair">
      <img class="on-field" src="img/logo-beige.png" alt="" />
      <img class="on-menu" src="img/logo-green.png" alt="" />
    </a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="bloom-menu" aria-label="Open menu">
      <span></span>
      <span></span>
    </button>
  </header>
  <p class="quick">
    <a href="https://www.phorest.com/salon/yuzuhairandbeauty" target="_blank" rel="noreferrer">Book</a>
    <span aria-hidden="true">|</span>
    <a href="https://maps.app.goo.gl/bhFS5wwkW3xxAdKd8" target="_blank" rel="noreferrer">Visit</a>
  </p>
  <footer class="mark">© Yuzu</footer>
  <div class="overlay" id="bloom-menu" hidden>
    <nav aria-label="Salon">
      <a href="results.html">Looks</a>
      <a href="../prices.html">Prices</a>
      <a href="../team.html">Team</a>
      <a href="https://maps.app.goo.gl/bhFS5wwkW3xxAdKd8" target="_blank" rel="noreferrer">Visit</a>
      <a href="https://www.phorest.com/salon/yuzuhairandbeauty" target="_blank" rel="noreferrer">Book</a>
      <a class="pill" href="../offers.html">Offers<span>Colour Tuesdays, Smooth Wednesdays and Colour Thursdays</span></a>
    </nav>
  </div>
  <script src="logo-home.js?v=1"></script>
  <script>
    (() => {
      const btn = document.querySelector(".menu-btn");
      const overlay = document.getElementById("bloom-menu");
      const open = () => {
        document.body.classList.add("menu-open");
        overlay.hidden = false;
        btn.setAttribute("aria-expanded", "true");
        btn.setAttribute("aria-label", "Close menu");
      };
      const close = () => {
        document.body.classList.remove("menu-open");
        overlay.hidden = true;
        btn.setAttribute("aria-expanded", "false");
        btn.setAttribute("aria-label", "Open menu");
      };
      btn.addEventListener("click", () => {
        if (document.body.classList.contains("menu-open")) close();
        else open();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && document.body.classList.contains("menu-open")) {
          event.preventDefault();
          close();
          btn.focus();
        }
      });
    })();
  </script>
</body>
</html>
